name: macOS checks and releases

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint --format=github
      - run: bun run format:check

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            worktrunk-target: aarch64-apple-darwin
            worktrunk-sha256: 8a2bb053c4bc80dea7d9ce6c221ff038d10a3d2dca2dc8f60d1b1a094fa783a9
          - runner: macos-15-intel
            arch: x64
            worktrunk-target: x86_64-apple-darwin
            worktrunk-sha256: aa898aa301617abaf91cb3078de4c8c11444a061016dc8f6dd80aa17cc1c46be
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Homebrew has no Intel macOS bottle for Worktrunk, so install the pinned upstream release instead.
      - name: Install Worktrunk
        env:
          WORKTRUNK_VERSION: v0.80.0
          WORKTRUNK_TARGET: ${{ matrix.worktrunk-target }}
          WORKTRUNK_SHA256: ${{ matrix.worktrunk-sha256 }}
        run: |
          archive="worktrunk-$WORKTRUNK_TARGET.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/max-sixty/worktrunk/releases/download/$WORKTRUNK_VERSION/$archive"
          echo "$WORKTRUNK_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/worktrunk-$WORKTRUNK_TARGET" >> "$GITHUB_PATH"
      - run: bun test
      - run: bun run typecheck
      - run: bun run build
      - run: python3 scripts/smoke-test.py dist/wt-dash
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: bun run formula
      - name: Create a draft for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 dist/wt-dash.rb --draft --verify-tag --title "wt-dash $RELEASE_TAG" --generate-notes
