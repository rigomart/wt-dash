name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint --format=github
      - run: bun run format:check

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            runner: macos-15
            artifact: darwin-arm64
            worktrunk-target: aarch64-apple-darwin
            worktrunk-sha256: 8a2bb053c4bc80dea7d9ce6c221ff038d10a3d2dca2dc8f60d1b1a094fa783a9
          - name: macOS (x64)
            runner: macos-15-intel
            artifact: darwin-x64
            worktrunk-target: x86_64-apple-darwin
            worktrunk-sha256: aa898aa301617abaf91cb3078de4c8c11444a061016dc8f6dd80aa17cc1c46be
          - name: Linux (arm64)
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
            worktrunk-target: aarch64-unknown-linux-musl
            worktrunk-sha256: 347b260c1b044a53a7720b33181d7c66dcde945efbd605d784e5b6a5616c17e9
          - name: Linux (x64)
            runner: ubuntu-24.04
            artifact: linux-x64
            worktrunk-target: x86_64-unknown-linux-musl
            worktrunk-sha256: 532ce3ed5eecb1be274c925b5887f61671e2434a4ca2561b9a8ac9379dbba199
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Homebrew has no Worktrunk bottle for Intel macOS or Linux, so install the pinned upstream release instead.
      - name: Install Worktrunk
        env:
          WORKTRUNK_VERSION: v0.80.0
          WORKTRUNK_TARGET: ${{ matrix.worktrunk-target }}
          WORKTRUNK_SHA256: ${{ matrix.worktrunk-sha256 }}
        run: |
          archive="worktrunk-$WORKTRUNK_TARGET.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/max-sixty/worktrunk/releases/download/$WORKTRUNK_VERSION/$archive"
          echo "$WORKTRUNK_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/worktrunk-$WORKTRUNK_TARGET" >> "$GITHUB_PATH"
      - run: bun test
      - run: bun run typecheck
      - run: bun run build
      - run: python3 scripts/smoke-test.py dist/wt-dash
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
